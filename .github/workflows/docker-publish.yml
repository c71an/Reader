name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (可选) 如果配置了 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN，则同时登录 Docker Hub
      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 安全清理历史旧版本（仅清理除 latest 之外的旧 Tag，严格保护 multi-arch 架构子镜像）
      - name: Prune old tagged container versions
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const packageName = 'reader';
            try {
              let versions = [];
              try {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container',
                  package_name: packageName,
                  per_page: 100,
                });
                versions = res.data;
              } catch (e) {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: 'container',
                  package_name: packageName,
                  org: context.repo.owner,
                  per_page: 100,
                });
                versions = res.data;
              }

              for (const v of versions) {
                const tags = v.metadata?.container?.tags || [];
                // 1. 保留 latest 主版本
                if (tags.includes('latest')) {
                  continue;
                }
                // 2. 核心保障：绝不删除 tags 为空的版本（它们是多架构 linux/arm64, linux/amd64 的实际镜像清单）
                if (tags.length === 0) {
                  continue;
                }
                // 3. 删除包含其它旧标签的版本（如旧的 sha-xxx 等）
                console.log(`Deleting old tagged version ${v.id} (tags: ${tags.join(',')})`);
                try {
                  await github.rest.packages.deletePackageVersionForUser({
                    package_type: 'container',
                    package_name: packageName,
                    package_version_id: v.id,
                  });
                } catch {
                  await github.rest.packages.deletePackageVersionForOrg({
                    package_type: 'container',
                    package_name: packageName,
                    org: context.repo.owner,
                    package_version_id: v.id,
                  });
                }
              }
            } catch (err) {
              console.log('Cleanup error:', err.message);
            }

